# Requires an ingress controller (e.g. nginx-ingress) installed in the cluster.
# Update the host value to match your domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kids-tales
  namespace: kids-tales
  labels:
    app.kubernetes.io/name: kids-tales
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: kids-tales.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kids-tales
                port:
                  name: http
