apiVersion: apps/v1
kind: Deployment
metadata:
  name: kids-tales
  namespace: kids-tales
  labels:
    app.kubernetes.io/name: kids-tales
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kids-tales
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kids-tales
    spec:
      containers:
        - name: kids-tales
          image: ghcr.io/talesmgodois/kids-tales:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: APP_VERSION
              value: "latest"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-secret
